<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP-тренажёр</title>
<style>
:root{
  --bg:#F8F9FA; --card:#FFFFFF; --text:#2D3748; --muted:#718096; --line:#E2E8F0; --soft:#F1F3F7;
  --accent:#5A67D8; --accent-2:#434190; --accent-soft:#EBF0FF;
  --pos:#2F855A; --neg:#97266D;
  --in-bg:#C6F6D5; --in-tx:#22543D; --out-bg:#FEEBC8; --out-tx:#744210; --edge-bg:#E9D8FD; --edge-tx:#553C9A;
  --demo-bg:#FBD38D; --band:#68D391; --bound:#38A169;
  --radius:14px; --shadow:0 1px 2px rgba(45,55,72,.06),0 6px 20px rgba(45,55,72,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.demo-bar{background:var(--demo-bg);color:#5F370E;text-align:center;font-weight:600;font-size:13px;padding:6px 16px;letter-spacing:.02em}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{display:block;font-size:17px}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#B794F4,#68D391);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.ticker{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ticker b{color:var(--text)}
.wallet-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.wallet-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--band)}
.timebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-top:14px;padding-bottom:4px}
.tnow{display:flex;flex-direction:column;margin-right:auto}
.tnow .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:10px;padding-bottom:2px;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
main{padding-top:16px;padding-bottom:32px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{border-color:#CBD5E0;background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;padding:11px}
.q{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid #CBD5E0;background:var(--card);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;padding:0;line-height:1;vertical-align:middle}
.q:hover{border-color:var(--accent);color:var(--accent)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.in{background:var(--in-bg);color:var(--in-tx)}
.chip.out{background:var(--out-bg);color:var(--out-tx)}
.chip.edge{background:var(--edge-bg);color:var(--edge-tx)}
.chip.closed{background:var(--soft);color:var(--muted)}
.pair{display:flex;align-items:center;gap:8px;font-size:16px}
.tk{display:inline-flex}
.tk i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:#2D3748;border:2px solid #fff}
.tk i+i{margin-left:-8px}
.pcard{cursor:pointer;transition:transform .15s,border-color .15s}
.pcard:hover{border-color:#CBD5E0;transform:translateY(-1px)}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv3 span,.tile span{display:block;font-size:12px;color:var(--muted)}
.kv3 b{font-size:15px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{background:var(--soft);border-radius:12px;padding:10px 12px}
.tile b{font-size:17px;display:block}
.tile small{color:var(--muted);font-size:12px}
.tile span{display:flex;align-items:center;gap:4px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.alert{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px}
.alert.warn{background:var(--out-bg);color:var(--out-tx)}
.alert.info{background:var(--accent-soft);color:var(--accent-2)}
.alert.ok{background:var(--in-bg);color:var(--in-tx)}
.alert.safe{background:var(--edge-bg);color:var(--edge-tx)}
.alert.err{background:#FED7E2;color:#702459}
.alert b{font-weight:700}
.alert ul{margin:4px 0 0;padding-left:18px}
.pools{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pool-opt{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--card)}
.pool-opt:hover{border-color:#CBD5E0}
.pool-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.pool-opt small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card);font-size:15px}
.inp:focus{outline:none;border-color:var(--accent)}
.inp:disabled{background:var(--soft);color:var(--muted)}
.inrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amt{display:flex;gap:8px}
.amt .inp{flex:1}
.chart{width:100%;min-height:180px;margin:6px 0}
.chart svg{display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px}
.chart .band{fill:var(--band);opacity:.22}
.chart .bound{stroke:var(--bound);stroke-width:1.2;stroke-dasharray:4 4}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .mark{stroke:#B794F4;stroke-width:1;stroke-dasharray:2 3}
.chart .bl{fill:var(--bound);font-size:11px;font-weight:600}
.comp{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--soft);margin:6px 0}
.comp i{display:block;height:100%}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
.tscroll{overflow-x:auto}
.pnl-break{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px;max-width:420px}
.pnl-break .sum{border-top:1px solid var(--line);padding-top:4px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.back{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0;margin-bottom:10px}
.overlay{position:fixed;inset:0;background:rgba(45,55,72,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--card);border-radius:18px;max-width:520px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(45,55,72,.25)}
.modal h2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--soft);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1;flex:none}
.txl{list-style:none;margin:10px 0;padding:0;counter-reset:tx}
.txl li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;counter-increment:tx}
.txl li .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.txl li .h:before{content:counter(tx) ". ";color:var(--muted);margin-right:2px}
.txl li .h span:first-child{flex:1}
.txl .opt{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:13px}
.txl .opt label{display:flex;gap:6px;align-items:flex-start;cursor:pointer}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 36px 10px 14px;box-shadow:0 10px 30px rgba(45,55,72,.18);font-size:14px;position:relative}
.toast .x{position:absolute;top:8px;right:8px;width:22px;height:22px;font-size:12px}
.steps{margin:6px 0 0;padding-left:20px}
.steps li{margin-bottom:4px}
.learn h3{margin-top:14px}
.learn ul{padding-left:20px;margin:4px 0 10px}
footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:13px}
.slider{width:100%;accent-color:var(--accent)}
.empty{text-align:center;padding:30px 16px}
@media (max-width:600px){
  body{font-size:14px}
  .kv3{grid-template-columns:1fr 1fr}
  .inrow{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .tile b{font-size:15px}
  .modal{padding:16px}
  .overlay{padding:16px}
  .ticker{width:100%;order:3}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
/*MODEL-START*/
/* Модель тренажёра: чистые функции, без DOM. Математика Uniswap v3 + метрики в стиле аналитики LP-позиций. */
var LPModel = (function () {
  'use strict';
  var HY = 8760;            // часов в году
  var FULL = 1e14;          // «полный диапазон»: от P/1e14 до P*1e14
  var RESERVE_USD = 40;     // сколько ETH (в $) советуем оставлять на газ
  var TOKENS = {
    ETH:  { dec: 4, native: true, color: '#B794F4' },
    WBTC: { dec: 6, color: '#FBD38D' },
    USDC: { dec: 2, color: '#90CDF4' },
    USDT: { dec: 2, color: '#68D391' }
  };
  var POOLS = [
    { id: 'eth-usdc-005', t0: 'ETH', t1: 'USDC', fee: 0.0005, vol: 180e6, tvl: 120e6, r: 0.20, pdec: 2, presets: [0.05, 0.15, 0.5] },
    { id: 'eth-usdc-03',  t0: 'ETH', t1: 'USDC', fee: 0.003,  vol: 12e6,  tvl: 60e6,  r: 0.25, pdec: 2, presets: [0.05, 0.15, 0.5] },
    { id: 'wbtc-eth-03',  t0: 'WBTC', t1: 'ETH', fee: 0.003,  vol: 8e6,   tvl: 40e6,  r: 0.15, pdec: 4, presets: [0.03, 0.1, 0.3] },
    { id: 'usdc-usdt-001', t0: 'USDC', t1: 'USDT', fee: 0.0001, vol: 60e6, tvl: 50e6, r: 0.002, pdec: 5, presets: [0.0005, 0.001, 0.005] }
  ];
  var GAS = { approve: 1.5, swap: 3.5, mint: 7, increase: 5, decrease: 5, collect: 3, close: 7 };
  var SPENDERS = { pm: 'менеджер позиций', router: 'роутер обменов' };

  function pool(id) { for (var k = 0; k < POOLS.length; k++) if (POOLS[k].id === id) return POOLS[k]; throw new Error('Пул не найден'); }
  function nowI(st) { return st.hist.ETH.length - 1; }
  function usd(st, tok, i) {
    if (i == null) i = nowI(st);
    if (tok === 'ETH') return st.hist.ETH[i];
    if (tok === 'WBTC') return st.hist.BTC[i];
    if (tok === 'USDT') return st.hist.USDT[i];
    return 1;
  }
  function price(st, p, i) { return usd(st, p.t0, i) / usd(st, p.t1, i); }
  function fx(n) { return String(Number((+n).toPrecision(6))).replace('.', ','); }

  // --- генератор случайных чисел (mulberry32), состояние хранится в st.rs ---
  function rnd(st) {
    var a = st.rs = (st.rs + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), a | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function gauss(st) { var u = 0; while (u === 0) u = rnd(st); var v = rnd(st); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  // --- Uniswap v3: количество токенов в позиции с ликвидностью L ---
  function amounts(L, P, pa, pb) {
    var sp = Math.sqrt(P), sa = Math.sqrt(pa), sb = Math.sqrt(pb);
    if (P <= pa) return { x: L * (1 / sa - 1 / sb), y: 0 };
    if (P >= pb) return { x: 0, y: L * (sb - sa) };
    return { x: L * (1 / sp - 1 / sb), y: L * (sp - sa) };
  }
  // стоимость (в token1) позиции с L = 1
  function vpl(P, pa, pb) { var a = amounts(1, P, pa, pb); return a.x * P + a.y; }

  // --- рынок ---
  function stepMarket(st, sc) {
    var dt = 1 / HY, vm = (sc && sc.volMult) || 1, dr = (sc && sc.drift) || 0;
    var z1 = gauss(st), z2 = 0.8 * z1 + 0.6 * gauss(st);
    var sE = 0.7 * vm, sB = 0.55 * vm;
    var H = st.hist, n = H.ETH.length - 1;
    var e = H.ETH[n] * Math.exp(dr - 0.5 * sE * sE * dt + sE * Math.sqrt(dt) * z1);
    var b = H.BTC[n] * Math.exp(dr - 0.5 * sB * sB * dt + sB * Math.sqrt(dt) * z2);
    var u = 1 + (H.USDT[n] - 1) * 0.85 + 0.00012 * gauss(st);
    u = Math.min(1.003, Math.max(0.997, u));
    H.ETH.push(+e.toPrecision(10)); H.BTC.push(+b.toPrecision(10)); H.USDT.push(+u.toFixed(7));
    return Math.abs(z1);
  }

  function newState(seed, nowMs) {
    var st = {
      v: 1, rs: (seed | 0) || 12345, t0: 0, startI: 0,
      hist: { ETH: [3200], BTC: [96000], USDT: [1] },
      wallet: { ETH: 2, USDC: 10000, USDT: 0, WBTC: 0 },
      approvals: {}, positions: [], nextId: 1, txs: [], poolL: {}, connected: false, introHidden: false
    };
    for (var k = 0; k < 720; k++) stepMarket(st, null); // 30 дней истории до старта
    st.startI = nowI(st);
    var hour = 3600e3, base = Math.floor(nowMs / hour) * hour;
    st.t0 = base - st.startI * hour;
    POOLS.forEach(function (p) {
      var P = price(st, p), u1 = usd(st, p.t1);
      st.poolL[p.id] = (p.tvl / u1) / vpl(P, P * (1 - p.r), P * (1 + p.r));
    });
    return st;
  }

  function status(st, pos, i) {
    if (pos.closed) return 'closed';
    if (pos.full) return 'in';
    var P = price(st, pool(pos.pool), i);
    if (P <= pos.pa || P >= pos.pb) return 'out';
    var w = Math.log(pos.pb / pos.pa), d = Math.min(Math.log(P / pos.pa), Math.log(pos.pb / P));
    return d < 0.12 * w ? 'edge' : 'in';
  }

  // --- машина времени: двигаем рынок по часам и начисляем комиссии ---
  function advance(st, hours, sc) {
    var open = st.positions.filter(function (p) { return !p.closed; });
    var before = {}, after = {};
    open.forEach(function (p) { before[p.id] = status(st, p); });
    var feesUsd = 0, i0 = nowI(st);
    for (var h = 0; h < hours; h++) {
      var absz = stepMarket(st, sc), i = nowI(st), vols = {};
      POOLS.forEach(function (p) {
        vols[p.id] = p.vol / 24 * ((sc && sc.volume) || 1) * (0.6 + 0.4 * Math.min(3, absz)) * Math.exp(0.25 * gauss(st) - 0.03125);
      });
      open.forEach(function (pos) {
        var p = pool(pos.pool), u0 = usd(st, p.t0, i), u1 = usd(st, p.t1, i), P = u0 / u1;
        var a = amounts(pos.L, P, pos.pa, pos.pb), val = a.x * u0 + a.y * u1;
        pos.int.usd += val; pos.int.t0 += val / u0; pos.int.t1 += val / u1; pos.int.h += 1;
        if (pos.L > 0 && P > pos.pa && P < pos.pb) {
          var share = pos.L / (pos.L + st.poolL[p.id]);
          var fee = vols[p.id] * p.fee * share;
          pos.f0 += fee / 2 / u0; pos.f1 += fee / 2 / u1; pos.inH += 1; feesUsd += fee;
        }
      });
    }
    open.forEach(function (p) { after[p.id] = status(st, p); });
    return { hours: hours, i0: i0, i1: nowI(st), feesUsd: feesUsd, before: before, after: after, ids: open.map(function (p) { return p.id; }) };
  }

  // --- газ и разрешения ---
  function gasMult(st) { var i = nowI(st); var s = Math.sin(i * 12.9898) * 43758.5453; return 0.75 + 0.5 * (s - Math.floor(s)); }
  function gasCost(st, kind) { var u = GAS[kind] * gasMult(st); return { usd: u, eth: u / usd(st, 'ETH') }; }
  function akey(spender, tok) { return spender + ':' + tok; }
  function needApprove(st, spender, tok, amt) {
    if (TOKENS[tok].native || !(amt > 0)) return false;
    var a = st.approvals[akey(spender, tok)];
    if (a === 'max') return false;
    return !((a || 0) >= amt * (1 - 1e-12));
  }
  function useApproval(st, spender, tok, amt) {
    var k = akey(spender, tok), a = st.approvals[k];
    if (typeof a === 'number') { a = a - amt; if (a <= 1e-9) delete st.approvals[k]; else st.approvals[k] = a; }
  }
  function approveTx(spender, tok, amt) {
    return { kind: 'approve', label: 'Разрешение (approve): ' + tok + ' для «' + SPENDERS[spender] + '»', approve: { spender: spender, tok: tok, amt: amt } };
  }
  function swapCost(a, b) { var st = { USDC: 1, USDT: 1 }; return (st[a] && st[b]) ? 0.0002 : 0.0035; }
  function ethIn(p, x, y) { return (p.t0 === 'ETH' ? x : 0) + (p.t1 === 'ETH' ? y : 0); }
  function need(st, tok, amt) {
    if (st.wallet[tok] + 1e-9 < amt) throw new Error('Не хватает ' + tok + ': нужно ' + fx(amt) + ', в кошельке ' + fx(st.wallet[tok]) + '.');
  }
  function clampWallet(st) { Object.keys(st.wallet).forEach(function (t) { if (st.wallet[t] < 0 && st.wallet[t] > -1e-6) st.wallet[t] = 0; }); }

  // --- позиции ---
  function pushFlow(st, pos, type, a0, a1) {
    var p = pool(pos.pool), i = nowI(st);
    pos.flows.push({ type: type, i: i, a0: a0, a1: a1, p0: usd(st, p.t0, i), p1: usd(st, p.t1, i) });
  }
  function pushGas(st, pos, g) {
    var p = pool(pos.pool), i = nowI(st);
    pos.flows.push({ type: 'gas', i: i, usd: g.usd, eth: g.eth, p0: usd(st, p.t0, i), p1: usd(st, p.t1, i) });
  }
  function newPosition(st, p, pa, pb, L, full, from) {
    var pos = { id: st.nextId++, pool: p.id, pa: pa, pb: pb, full: !!full, L: L, f0: 0, f1: 0, openI: nowI(st),
      closed: false, closedI: null, from: from || null, to: null, flows: [], int: { usd: 0, t0: 0, t1: 0, h: 0 }, inH: 0 };
    st.positions.push(pos);
    return pos;
  }
  function getPos(st, id) { for (var k = 0; k < st.positions.length; k++) if (st.positions[k].id === id) return st.positions[k]; return null; }

  function validRange(pa, pb) {
    if (!(pa > 0) || !(pb > 0) || !isFinite(pa) || !isFinite(pb)) throw new Error('Укажи нижнюю и верхнюю границу цены числами больше нуля.');
    if (!(pb > pa * 1.0001)) throw new Error('Нижняя граница должна быть меньше верхней.');
  }

  function quoteMint(st, poolId, pa, pb, valueUsd) {
    var p = pool(poolId), P = price(st, p), u1 = usd(st, p.t1);
    validRange(pa, pb);
    if (!(valueUsd > 0)) throw new Error('Введи сумму больше нуля.');
    if (valueUsd > 1e7) throw new Error('В демо можно внести не больше $10 000 000.');
    var L = (valueUsd / u1) / vpl(P, pa, pb), a = amounts(L, P, pa, pb);
    var inRange = P > pa && P < pb;
    var share = L / (L + st.poolL[p.id]);
    return { L: L, x: a.x, y: a.y, P: P, inRange: inRange, single: inRange ? null : (P <= pa ? 't0' : 't1'),
      feeApr: inRange ? p.vol * p.fee * share * 365 / valueUsd : 0 };
  }

  function maxMintValue(st, poolId, pa, pb) {
    var p = pool(poolId), q = quoteMint(st, poolId, pa, pb, 1000), res = Infinity;
    [[p.t0, q.x], [p.t1, q.y]].forEach(function (e) {
      if (e[1] > 1e-15) {
        var bal = st.wallet[e[0]];
        if (e[0] === 'ETH') bal -= RESERVE_USD / usd(st, 'ETH');
        res = Math.min(res, Math.max(0, bal) / e[1] * 1000);
      }
    });
    return isFinite(res) ? Math.floor(res * 0.999) : 0;
  }

  function planMint(st, poolId, pa, pb, valueUsd, full) {
    var p = pool(poolId), q = quoteMint(st, poolId, pa, pb, valueUsd), txs = [];
    if (needApprove(st, 'pm', p.t0, q.x)) txs.push(approveTx('pm', p.t0, q.x));
    if (needApprove(st, 'pm', p.t1, q.y)) txs.push(approveTx('pm', p.t1, q.y));
    txs.push({ kind: 'mint', label: 'Создать позицию ' + p.t0 + '/' + p.t1, detail: 'Внести ' + fx(q.x) + ' ' + p.t0 + ' и ' + fx(q.y) + ' ' + p.t1 });
    return {
      txs: txs, ethOut: ethIn(p, q.x, q.y), quote: q,
      check: function (st) { need(st, p.t0, q.x); need(st, p.t1, q.y); },
      run: function (st, gas) {
        st.wallet[p.t0] -= q.x; st.wallet[p.t1] -= q.y;
        useApproval(st, 'pm', p.t0, q.x); useApproval(st, 'pm', p.t1, q.y);
        var pos = newPosition(st, p, pa, pb, q.L, full, null);
        pushFlow(st, pos, 'deposit', q.x, q.y);
        pushGas(st, pos, gas[gas.length - 1]);
        return pos;
      }
    };
  }

  function quoteSwap(st, from, to, amount) {
    if (from === to) throw new Error('Выбери два разных токена.');
    if (!(amount > 0)) throw new Error('Введи сумму больше нуля.');
    var c = swapCost(from, to);
    return { out: amount * usd(st, from) * (1 - c) / usd(st, to), cost: c, costUsd: amount * usd(st, from) * c };
  }
  function planSwap(st, from, to, amount) {
    var q = quoteSwap(st, from, to, amount), txs = [];
    if (needApprove(st, 'router', from, amount)) txs.push(approveTx('router', from, amount));
    txs.push({ kind: 'swap', label: 'Обмен ' + from + ' → ' + to, detail: 'Отдать ' + fx(amount) + ' ' + from + ', получить ≈ ' + fx(q.out) + ' ' + to });
    return {
      txs: txs, ethOut: from === 'ETH' ? amount : 0, quote: q,
      check: function (st) { need(st, from, amount); },
      run: function (st) { st.wallet[from] -= amount; st.wallet[to] += q.out; useApproval(st, 'router', from, amount); return q.out; }
    };
  }

  function planIncrease(st, pos, valueUsd) {
    if (pos.closed) throw new Error('Позиция закрыта.');
    var p = pool(pos.pool), q = quoteMint(st, pos.pool, pos.pa, pos.pb, valueUsd), txs = [];
    if (needApprove(st, 'pm', p.t0, q.x)) txs.push(approveTx('pm', p.t0, q.x));
    if (needApprove(st, 'pm', p.t1, q.y)) txs.push(approveTx('pm', p.t1, q.y));
    txs.push({ kind: 'increase', label: 'Добавить ликвидность в #' + pos.id, detail: 'Внести ' + fx(q.x) + ' ' + p.t0 + ' и ' + fx(q.y) + ' ' + p.t1 });
    return {
      txs: txs, ethOut: ethIn(p, q.x, q.y), quote: q,
      check: function (st) { need(st, p.t0, q.x); need(st, p.t1, q.y); },
      run: function (st, gas) {
        st.wallet[p.t0] -= q.x; st.wallet[p.t1] -= q.y;
        useApproval(st, 'pm', p.t0, q.x); useApproval(st, 'pm', p.t1, q.y);
        pos.L += q.L; pushFlow(st, pos, 'deposit', q.x, q.y); pushGas(st, pos, gas[gas.length - 1]);
        return pos;
      }
    };
  }

  function planDecrease(st, pos, frac) {
    if (pos.closed) throw new Error('Позиция закрыта.');
    if (!(frac > 0 && frac < 1)) throw new Error('Выбери долю от 1 до 99%. Чтобы вывести всё, закрой позицию.');
    var p = pool(pos.pool), a = amounts(pos.L * frac, price(st, p), pos.pa, pos.pb);
    return {
      txs: [{ kind: 'decrease', label: 'Вывести ' + Math.round(frac * 100) + '% ликвидности из #' + pos.id, detail: 'Получить ' + fx(a.x) + ' ' + p.t0 + ' и ' + fx(a.y) + ' ' + p.t1 }],
      ethOut: -ethIn(p, a.x, a.y), quote: a,
      run: function (st, gas) {
        pos.L *= (1 - frac); st.wallet[p.t0] += a.x; st.wallet[p.t1] += a.y;
        pushFlow(st, pos, 'withdraw', a.x, a.y); pushGas(st, pos, gas[0]); return pos;
      }
    };
  }

  function planCollect(st, pos) {
    var p = pool(pos.pool), v = pos.f0 * usd(st, p.t0) + pos.f1 * usd(st, p.t1);
    if (v < 0.01) throw new Error('Пока нечего собирать: комиссии меньше $0,01. Перемотай время вперёд.');
    var f0 = pos.f0, f1 = pos.f1;
    return {
      txs: [{ kind: 'collect', label: 'Собрать комиссии из #' + pos.id, detail: 'Получить ' + fx(f0) + ' ' + p.t0 + ' и ' + fx(f1) + ' ' + p.t1 }],
      ethOut: -ethIn(p, f0, f1), feesUsd: v,
      run: function (st, gas) {
        st.wallet[p.t0] += f0; st.wallet[p.t1] += f1; pushFlow(st, pos, 'collect', f0, f1);
        pos.f0 = 0; pos.f1 = 0; pushGas(st, pos, gas[0]); return pos;
      }
    };
  }

  function closeInto(st, pos) {
    var p = pool(pos.pool), a = amounts(pos.L, price(st, p), pos.pa, pos.pb);
    st.wallet[p.t0] += a.x + pos.f0; st.wallet[p.t1] += a.y + pos.f1;
    if (a.x > 0 || a.y > 0) pushFlow(st, pos, 'withdraw', a.x, a.y);
    if (pos.f0 > 0 || pos.f1 > 0) pushFlow(st, pos, 'collect', pos.f0, pos.f1);
    pos.L = 0; pos.f0 = 0; pos.f1 = 0; pos.closed = true; pos.closedI = nowI(st);
  }
  function planClose(st, pos) {
    if (pos.closed) throw new Error('Позиция уже закрыта.');
    var p = pool(pos.pool), a = amounts(pos.L, price(st, p), pos.pa, pos.pb);
    return {
      txs: [{ kind: 'close', label: 'Закрыть #' + pos.id + ': вывести всё и собрать комиссии', detail: 'Получить ' + fx(a.x + pos.f0) + ' ' + p.t0 + ' и ' + fx(a.y + pos.f1) + ' ' + p.t1 }],
      ethOut: -ethIn(p, a.x + pos.f0, a.y + pos.f1),
      run: function (st, gas) { closeInto(st, pos); pushGas(st, pos, gas[0]); return pos; }
    };
  }

  // сколько продать, чтобы получить нужное соотношение токенов для нового диапазона (с учётом стоимости обмена c)
  function solveRebalance(a0, a1, P, x1, y1, c) {
    var g = 1 - c;
    if (x1 <= 0) return { sell: 't0', s: a0, L: (a1 + a0 * P * g) / y1 };
    if (y1 <= 0) return { sell: 't1', s: a1, L: (a0 + a1 / P * g) / x1 };
    var r = x1 / y1;
    if (a0 > r * a1) { var s0 = (a0 - r * a1) / (1 + r * P * g); return { sell: 't0', s: s0, L: (a0 - s0) / x1 }; }
    var s1 = (r * a1 - a0) / (r + g / P); return { sell: 't1', s: s1, L: (a1 - s1) / y1 };
  }

  function quoteRerange(st, pos, pa, pb) {
    if (pos.closed) throw new Error('Позиция закрыта.');
    validRange(pa, pb);
    var p = pool(pos.pool), P = price(st, p), u0 = usd(st, p.t0), u1 = usd(st, p.t1);
    var a = amounts(pos.L, P, pos.pa, pos.pb), one = amounts(1, P, pa, pb), c = swapCost(p.t0, p.t1);
    var sol = solveRebalance(a.x, a.y, P, one.x, one.y, c);
    var sell = sol.sell, s = sol.s, L2 = sol.L;
    var swapUsd = sell === 't0' ? s * u0 : s * u1;
    if (swapUsd < 1) {
      s = 0; swapUsd = 0;
      L2 = Math.min(one.x > 0 ? a.x / one.x : Infinity, one.y > 0 ? a.y / one.y : Infinity);
    }
    var got = s > 0 ? (sell === 't0' ? s * P * (1 - c) : s / P * (1 - c)) : 0;
    var n = amounts(L2, P, pa, pb);
    var after0 = a.x - (sell === 't0' ? s : 0) + (sell === 't1' ? got : 0);
    var after1 = a.y - (sell === 't1' ? s : 0) + (sell === 't0' ? got : 0);
    return { a: a, f0: pos.f0, f1: pos.f1, sell: sell, sellTok: sell === 't0' ? p.t0 : p.t1, buyTok: sell === 't0' ? p.t1 : p.t0,
      s: s, got: got, swapUsd: swapUsd, swapLossUsd: swapUsd * c, L: L2, x: n.x, y: n.y,
      dust0: Math.max(0, after0 - n.x), dust1: Math.max(0, after1 - n.y), P: P,
      oldUsd: a.x * u0 + a.y * u1, newUsd: n.x * u0 + n.y * u1 };
  }

  function planRerange(st, pos, pa, pb, full) {
    var p = pool(pos.pool), q = quoteRerange(st, pos, pa, pb), txs = [];
    txs.push({ kind: 'close', label: 'Вывести всё из #' + pos.id + ' и собрать комиссии', detail: 'Получить ' + fx(q.a.x) + ' ' + p.t0 + ' и ' + fx(q.a.y) + ' ' + p.t1 + ' + комиссии' });
    var appr = {}; // разрешения, которые выдаются в этом же плане
    if (q.s > 0) {
      if (needApprove(st, 'router', q.sellTok, q.s)) { txs.push(approveTx('router', q.sellTok, q.s)); }
      txs.push({ kind: 'swap', label: 'Обмен ' + q.sellTok + ' → ' + q.buyTok, detail: 'Отдать ' + fx(q.s) + ' ' + q.sellTok + ', получить ≈ ' + fx(q.got) + ' ' + q.buyTok });
    }
    if (needApprove(st, 'pm', p.t0, q.x)) txs.push(approveTx('pm', p.t0, q.x));
    if (needApprove(st, 'pm', p.t1, q.y)) txs.push(approveTx('pm', p.t1, q.y));
    txs.push({ kind: 'mint', label: 'Создать новую позицию ' + p.t0 + '/' + p.t1, detail: 'Внести ' + fx(q.x) + ' ' + p.t0 + ' и ' + fx(q.y) + ' ' + p.t1 });
    var ethBack = ethIn(p, q.a.x + q.f0, q.a.y + q.f1);
    var ethSpend = ethIn(p, q.x, q.y) + (q.sellTok === 'ETH' ? q.s : 0) - (q.buyTok === 'ETH' ? q.got : 0);
    return {
      txs: txs, ethOut: ethSpend - ethBack, quote: q,
      run: function (st, gas) {
        closeInto(st, pos);
        txs.forEach(function (t, k) { if (t.kind === 'close') pushGas(st, pos, gas[k]); });
        if (q.s > 0) { st.wallet[q.sellTok] -= q.s; st.wallet[q.buyTok] += q.got; useApproval(st, 'router', q.sellTok, q.s); }
        st.wallet[p.t0] -= q.x; st.wallet[p.t1] -= q.y;
        useApproval(st, 'pm', p.t0, q.x); useApproval(st, 'pm', p.t1, q.y);
        var np = newPosition(st, p, pa, pb, q.L, full, pos.id);
        pos.to = np.id;
        pushFlow(st, np, 'deposit', q.x, q.y);
        txs.forEach(function (t, k) { if (t.kind === 'swap' || t.kind === 'mint') pushGas(st, np, gas[k]); });
        return np;
      }
    };
  }

  function planRevoke(st, key) {
    var parts = key.split(':');
    return {
      txs: [{ kind: 'approve', label: 'Отозвать разрешение: ' + parts[1] + ' для «' + SPENDERS[parts[0]] + '»', detail: 'Разрешение станет равным нулю' }],
      ethOut: 0,
      run: function (st) { delete st.approvals[key]; }
    };
  }

  function planGas(st, plan) {
    var list = plan.txs.map(function (t) { return gasCost(st, t.kind); });
    var u = 0, e = 0; list.forEach(function (g) { u += g.usd; e += g.eth; });
    return { list: list, usd: u, eth: e };
  }

  function executePlan(st, plan, opts) {
    opts = opts || {}; var max = opts.max || {};
    var g = planGas(st, plan), needEth = g.eth + Math.max(0, plan.ethOut || 0);
    if (st.wallet.ETH + 1e-12 < needEth) {
      throw new Error('Не хватает ETH. Нужно ≈ ' + fx(needEth) + ' ETH (из них газ ≈ ' + fx(g.eth) + ' ETH), а в кошельке ' + fx(st.wallet.ETH) + ' ETH. Газ всегда платится в ETH, поэтому оставляй небольшой запас.');
    }
    if (plan.check) plan.check(st);
    st.wallet.ETH -= g.eth;
    var i = nowI(st);
    plan.txs.forEach(function (t, k) {
      if (t.approve) st.approvals[akey(t.approve.spender, t.approve.tok)] = max[k] ? 'max' : t.approve.amt;
      st.txs.unshift({ i: i, label: t.label, kind: t.kind, gasUsd: g.list[k].usd, gasEth: g.list[k].eth, max: !!(t.approve && max[k]) });
    });
    var res = plan.run(st, g.list);
    clampWallet(st);
    return res;
  }

  // --- метрики позиции ---
  // bench: 'hold' — сравнение с «просто держать токены»; 'usd' — с долларом; 't0'/'t1' — с одним из токенов
  function metrics(st, pos, bench) {
    var p = pool(pos.pool), i = pos.closed ? pos.closedI : nowI(st);
    var u0 = usd(st, p.t0, i), u1 = usd(st, p.t1, i), ue = usd(st, 'ETH', i), P = u0 / u1;
    var a = amounts(pos.L, P, pos.pa, pos.pb);
    function V(a0, a1, p0, p1) {
      if (bench === 'hold') return a0 * u0 + a1 * u1;
      var vu = a0 * p0 + a1 * p1;
      if (bench === 'usd') return vu;
      if (bench === 't0') return vu / p0;
      return vu / p1;
    }
    var pooled = V(a.x, a.y, u0, u1), unc = V(pos.f0, pos.f1, u0, u1);
    var dep = 0, wd = 0, col = 0, gas = 0, colUsd = 0, gasUsd = 0, depUsd = 0, wdUsd = 0;
    pos.flows.forEach(function (f) {
      if (f.type === 'gas') {
        gasUsd += f.usd;
        gas += bench === 'hold' ? f.eth * ue : bench === 'usd' ? f.usd : bench === 't0' ? f.usd / f.p0 : f.usd / f.p1;
        return;
      }
      var v = V(f.a0, f.a1, f.p0, f.p1), vu = f.a0 * f.p0 + f.a1 * f.p1;
      if (f.type === 'deposit') depUsd += vu; else if (f.type === 'withdraw') wdUsd += vu;
      if (f.type === 'deposit') dep += v;
      else if (f.type === 'withdraw') wd += v;
      else if (f.type === 'collect') { col += v; colUsd += f.a0 * f.p0 + f.a1 * f.p1; }
    });
    var div = pooled + wd - dep, fees = unc + col, poolPnl = div + fees, total = poolPnl - gas;
    var h = pos.int.h, capSum = bench === 't0' ? pos.int.t0 : bench === 't1' ? pos.int.t1 : pos.int.usd;
    var cap = h > 0 ? capSum / h : 0, ok = h >= 24 && cap > 0;
    var uncUsd = pos.f0 * u0 + pos.f1 * u1;
    return {
      bench: bench, unit: bench === 't0' ? p.t0 : bench === 't1' ? p.t1 : 'USD',
      x: a.x, y: a.y, P: P, pooled: pooled, pooledUsd: a.x * u0 + a.y * u1, unc: unc, uncUsd: uncUsd,
      dep: dep, wd: wd, depUsd: depUsd, wdUsd: wdUsd, col: col, gas: gas, gasUsd: gasUsd, div: div, fees: fees, poolPnl: poolPnl, total: total,
      apr: ok ? total / cap * HY / h : null, feeApr: ok ? fees / cap * HY / h : null,
      roi: (dep + gas) > 0 ? total / (dep + gas) : null,
      feesUsdAll: uncUsd + colUsd, avgDailyFeesUsd: h >= 1 ? (uncUsd + colUsd) / (h / 24) : null,
      ageH: h, inH: pos.inH, status: status(st, pos, i)
    };
  }

  return {
    HY: HY, FULL: FULL, RESERVE_USD: RESERVE_USD, TOKENS: TOKENS, POOLS: POOLS, GAS: GAS, SPENDERS: SPENDERS,
    pool: pool, nowI: nowI, usd: usd, price: price, amounts: amounts, vpl: vpl, newState: newState, status: status,
    advance: advance, gasCost: gasCost, needApprove: needApprove, getPos: getPos, quoteMint: quoteMint, maxMintValue: maxMintValue,
    planMint: planMint, quoteSwap: quoteSwap, planSwap: planSwap, planIncrease: planIncrease, planDecrease: planDecrease,
    planCollect: planCollect, planClose: planClose, solveRebalance: solveRebalance, quoteRerange: quoteRerange,
    planRerange: planRerange, planRevoke: planRevoke, planGas: planGas, executePlan: executePlan, metrics: metrics, swapCost: swapCost
  };
})();
/*MODEL-END*/
</script>

var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
var MS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
function dateF(i, short) {
  var d = new Date(st.t0 + i * 3600e3);
  if (short) return d.getDate() + ' ' + MS[d.getMonth()];
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + ', ' + String(d.getHours()).padStart(2, '0') + ':00';
}
function ageF(h) { if (h < 24) return h + ' ч'; var d = Math.floor(h / 24); return d + ' дн' + (h % 24 ? ' ' + (h % 24) + ' ч' : ''); }
function benchVal(n, m) { return m.unit === 'USD' ? money(n) : tokF(n, m.unit); }
function sbenchVal(n, m) { return m.unit === 'USD' ? smoney(n) : stok(n, m.unit); }
function parseNum(s) { if (s == null) return NaN; s = String(s).replace(/[\s ]/g, '').replace(',', '.'); if (s === '') return NaN; return Number(s); }
function inputPrice(P, p) { return P.toFixed(p.pdec); }
function walletUsd() { return Object.keys(st.wallet).reduce(function (s, t) { return s + st.wallet[t] * M.usd(st, t); }, 0); }
function tk(t) { return '<i style="background:' + M.TOKENS[t].color + '">' + t.slice(0, t === 'WBTC' ? 4 : 3) + '</i>'; }
function pairBadge(p) { return '<span class="tk">' + tk(p.t0) + tk(p.t1) + '</span>'; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

var STATUS = { in: 'В диапазоне', edge: 'У границы', out: 'Вне диапазона', closed: 'Закрыта' };
function chip(s) { return '<span class="chip ' + s + '">' + STATUS[s] + '</span>'; }
function rangeF(pos, p) {
  if (pos.full) return 'Полный диапазон (0 → ∞)';
  return priceF(pos.pa, p) + ' – ' + priceF(pos.pb, p) + ' ' + p.t1 + ' за 1 ' + p.t0;
}
function q(k) { return '<button class="q" data-act="tip" data-k="' + k + '" aria-label="Подсказка">?</button>'; }

// ---------- общий каркас ----------

  var app = document.getElementById('app');

  app.innerHTML = header() + nav() + '<main class="wrap">' + view() + '</main>' + footer();
  document.getElementById('modal-root').innerHTML = ui.modal ? modalHtml() : '';
  drawCharts();
  renderToasts();
}

function header() {

      '<div class="brand"><span class="logo">LP</span><span><b>LP-тренажёр</b><small>учебный симулятор ликвидности</small></span></div>' +
      '<div class="ticker"><span>ETH <b>' + money(e) + '</b> ' + chg(e, e0) + '</span><span>BTC <b>' + money(b) + '</b> ' + chg(b, b0) + '</span><span class="sm">с начала тренировки</span></div>' +
      (st.connected
        ? '<button class="wallet-btn" data-act="tab" data-tab="wallet"><span class="dot"></span>Демо-кошелёк · ' + money(walletUsd()) + '</button>'

      '<div class="tbtns">' +

        '<button class="btn sm" data-act="adv" data-h="24">+1 день</button>' +
        '<button class="btn sm" data-act="adv" data-h="168">+1 неделя</button>' +
        '<button class="btn sm" data-act="adv" data-h="720">+1 месяц</button>' +
      '</div>' +
      '<div class="tbtns">' +
        '<button class="btn sm ghost" data-act="sc" data-k="crash">Сценарий: обвал −30%</button>' +

function nav() {
  var tabs = [['positions', 'Мои позиции'], ['new', 'Новая позиция'], ['wallet', 'Кошелёк'], ['history', 'История'], ['learn', 'Как это работает']];
  var cur = ui.tab === 'pos' ? 'positions' : ui.tab;
  return '<div class="wrap"><nav class="tabs">' + tabs.map(function (t) {
    return '<button class="' + (cur === t[0] ? 'on' : '') + '" data-act="tab" data-tab="' + t[0] + '">' + t[1] + '</button>';
  }).join('') + '</nav></div>';
}

function footer() {
  return '<footer><div class="wrap">' +
    '<p><b>LP-тренажёр — учебный симулятор, а не финансовый совет.</b> Пулы, цены, объёмы торгов и газ смоделированы. В реальных протоколах цифры и результаты будут другими. ' +
    'Тренажёр ничего не отправляет в интернет, не подключается к настоящим кошелькам и никогда не попросит seed-фразу или приватный ключ.</p>' +
    '<button class="btn sm" data-act="reset">Сбросить демо и начать заново</button>' +

function view() {
  if (ui.tab === 'pos') { var pos = M.getPos(st, ui.posId); if (pos) return viewPosition(pos); ui.tab = 'positions'; }
  if (ui.tab === 'new') return viewNew();
  if (ui.tab === 'wallet') return viewWallet();
  if (ui.tab === 'history') return viewHistory();
  if (ui.tab === 'learn') return viewLearn();
  return viewPositions();
}

// ---------- «Мои позиции» ----------
function intro() {
  if (st.introHidden) return '';
  return '<div class="card"><div class="row between"><h2 style="margin:0">С чего начать</h2><button class="btn sm ghost" data-act="intro-hide">Скрыть</button></div>' +
    '<ol class="steps">' +
      '<li>Подключи демо-кошелёк. В нём 10 000 демо-USDC и 2 демо-ETH. Это игровые деньги, потерять их не страшно.</li>' +
      '<li>Открой «Новая позиция» и внеси ликвидность в пул ETH/USDC.</li>' +
      '<li>Перематывай время кнопками сверху и смотри, как меняются стоимость, комиссии и PnL.</li>' +
      '<li>Нажми «Сценарий: обвал −30%». Так выглядит выход цены из диапазона. Попробуй сменить диапазон или закрыть позицию.</li>' +
    '</ol>' +
    '<div class="alert safe">Главное правило DeFi: <b>никто и никогда не должен просить твою seed-фразу</b> — ни сайт, ни кошелёк, ни «поддержка». Если просят — это мошенники.</div>' +
    '</div>';
}

function viewPositions() {
  var all = st.positions.slice().reverse();
  var open = all.filter(function (p) { return !p.closed; });
  var list = ui.showClosed ? all : open;
  var h = intro() + '<div class="row between" style="margin-bottom:10px"><h1>Мои позиции</h1><div class="row">' +
    (all.length > open.length ? '<button class="btn sm ghost" data-act="show-closed">' + (ui.showClosed ? 'Скрыть закрытые' : 'Показать закрытые (' + (all.length - open.length) + ')') + '</button>' : '') +
    '<button class="btn primary sm" data-act="tab" data-tab="new">+ Новая позиция</button></div></div>';
  if (!list.length) {
    return h + '<div class="card empty"><h2>Пока нет открытых позиций</h2><p class="muted">Создай первую позицию — это безопасно, деньги игровые.</p><button class="btn primary" data-act="tab" data-tab="new">Создать позицию</button></div>';
  }
  return h + '<div class="grid2">' + list.map(posCard).join('') + '</div>';
}

function posCard(pos) {
  var p = M.pool(pos.pool), m = M.metrics(st, pos, 'hold');
  return '<div class="card pcard" data-act="open" data-id="' + pos.id + '">' +
    '<div class="row between"><div class="pair">' + pairBadge(p) + '<b>' + pairF(p) + '</b><span class="chip">' + feeF(p) + '</span></div>' + chip(m.status) + '</div>' +
    '<div class="muted sm" style="margin-top:6px">#' + pos.id + ' · ' + rangeF(pos, p) + '</div>' +
    '<div class="kv3">' +
      '<div><span>Стоимость</span><b>' + money(m.pooledUsd) + '</b></div>' +
      '<div><span>Комиссии</span><b>' + money(pos.closed ? m.feesUsdAll : m.uncUsd) + '</b></div>' +
      '<div><span>' + (pos.closed ? 'Итог PnL' : 'PnL vs HOLD') + '</span><b class="' + cls(m.total) + '">' + smoney(m.total) + '</b></div>' +
    '</div></div>';
}

// ---------- страница позиции ----------
function viewPosition(pos) {
  var p = M.pool(pos.pool), m = M.metrics(st, pos, ui.bench);
  var u0 = M.usd(st, p.t0, pos.closed ? pos.closedI : null), u1 = M.usd(st, p.t1, pos.closed ? pos.closedI : null);
  var v0 = m.x * u0, v1 = m.y * u1, tot = v0 + v1, sh0 = tot > 0 ? v0 / tot : 0;
  charts.pos = { pool: p, days: ui.days, pa: pos.pa, pb: pos.pb, full: pos.full, markI: pos.openI, endI: pos.closed ? pos.closedI : null };
  var benches = [['hold', 'HOLD'], ['usd', 'USD'], ['t0', p.t0], ['t1', p.t1]];
  var h = '<button class="back" data-act="tab" data-tab="positions">← Все позиции</button>';
  h += '<div class="card"><div class="row between"><div class="pair">' + pairBadge(p) + '<h1 style="margin:0">' + pairF(p) + '</h1><span class="chip">' + feeF(p) + '</span><span class="muted">#' + pos.id + '</span></div>' + chip(m.status) + '</div>';
  h += '<p class="muted sm" style="margin-top:6px">Диапазон ' + q('range') + ' ' + rangeF(pos, p) + ' · Текущая цена: 1 ' + p.t0 + ' = ' + priceF(M.price(st, p), p) + ' ' + p.t1 +
    (pos.from ? ' · перенесена из #' + pos.from : '') + (pos.to ? ' · продолжение: <a href="#" data-act="open" data-id="' + pos.to + '">#' + pos.to + '</a>' : '') + '</p>';

  if (m.status === 'out') {
    var allIn = m.x > 0 ? p.t0 : p.t1;
    h += '<div class="alert warn"><b>Цена вышла за диапазон.</b> Сейчас позиция целиком в ' + allIn + ', комиссии не начисляются. Варианты: подождать, пока цена вернётся; сменить диапазон (это стоит газа и фиксирует divergence loss); закрыть позицию.</div>';
  } else if (m.status === 'edge') {
    h += '<div class="alert safe">Цена подошла к границе диапазона. Если она выйдет за неё, комиссии перестанут начисляться.</div>';
  } else if (pos.closed) {
    h += '<div class="alert info">Позиция закрыта ' + dateF(pos.closedI) + '. Итоги зафиксированы на момент закрытия.</div>';
  }

  h += '<div class="row between" style="margin-top:8px"><div class="seg">' + [[7, '7 дн'], [30, '30 дн'], [90, '90 дн'], [100000, 'Всё']].map(function (d) {
    return '<button class="' + (ui.days === d[0] ? 'on' : '') + '" data-act="days" data-v="' + d[0] + '">' + d[1] + '</button>'; }).join('') + '</div>' +
    '<span class="sm muted">зелёная полоса — твой диапазон</span></div>';
  h += '<div class="chart" data-chart="pos"></div>';

  if (!pos.closed) {
    h += '<div class="actions">' +
      '<button class="btn" data-act="add" data-id="' + pos.id + '">Добавить ликвидность</button>' +
      '<button class="btn" data-act="wd" data-id="' + pos.id + '">Вывести часть</button>' +
      '<button class="btn" data-act="collect" data-id="' + pos.id + '">Собрать комиссии</button>' +
      '<button class="btn" data-act="rerange" data-id="' + pos.id + '">Сменить диапазон</button>' +
      '<button class="btn" data-act="close-pos" data-id="' + pos.id + '">Закрыть позицию</button>' +
    '</div>';
  }
  h += '</div>';

  // метрики
  h += '<div class="card"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Результат</h2><div class="row"><span class="sm muted">Бенчмарк ' + q('bench') + '</span><div class="seg">' +
    benches.map(function (b) { return '<button class="' + (ui.bench === b[0] ? 'on' : '') + '" data-act="bench" data-v="' + b[0] + '">' + b[1] + '</button>'; }).join('') + '</div></div></div>';
  h += '<div class="tiles">' +
    tile('Total PnL', 'total', '<span class="' + cls(m.total) + '">' + sbenchVal(m.total, m) + '</span>', 'ROI ' + pct(m.roi, true)) +
    tile('Total APR', 'apr', '<span class="' + cls(m.apr) + '">' + (m.apr == null ? '—' : pct(m.apr, true)) + '</span>', m.apr == null ? 'появится через сутки' : 'в пересчёте на год') +
    tile('Fee APR', 'feeApr', m.feeApr == null ? '—' : pct(m.feeApr), m.feeApr == null ? 'появится через сутки' : 'только комиссии') +
    tile('Стоимость позиции', 'pooled', money(m.pooledUsd), pos.closed ? 'выведено' : 'без комиссий') +
    tile('Несобранные комиссии', 'unc', money(m.uncUsd), tokF(pos.f0, p.t0) + ' + ' + tokF(pos.f1, p.t1)) +
    tile('Средние комиссии в день', 'daily', m.avgDailyFeesUsd == null ? '—' : money(m.avgDailyFeesUsd), 'всего ' + money(m.feesUsdAll)) +
    tile('Возраст', 'age', ageF(m.ageH), 'в диапазоне ' + ageF(m.inH)) +
    '</div>';
  h += '<h3 style="margin-top:16px">Из чего сложился PnL</h3><div class="pnl-break">' +
    '<span>Divergence loss ' + q('div') + '</span><b class="' + cls(m.div) + '">' + sbenchVal(m.div, m) + '</b>' +

  h += '<p class="sm muted" style="margin-top:10px">Внесено: ' + money(m.depUsd) + (m.wdUsd ? ' · выведено: ' + money(m.wdUsd) : '') + ' · газ: ' + money(m.gasUsd) + ' (в долларах на момент операций).' +
    (ui.bench === 'hold' ? ' В режиме HOLD строки выше пересчитаны по текущим ценам, поэтому газ там может отличаться.' : '') + '</p>';
  h += '</div>';

  // состав
  if (!pos.closed) {
    h += '<div class="card"><h2>Что сейчас внутри позиции</h2>' +
      '<div class="comp"><i style="width:' + (sh0 * 100) + '%;background:' + M.TOKENS[p.t0].color + '"></i><i style="width:' + ((1 - sh0) * 100) + '%;background:' + M.TOKENS[p.t1].color + '"></i></div>' +

  }

  // история позиции

function presetRange(p, P, preset) {
  if (preset === 'full') return { pa: P / M.FULL, pb: P * M.FULL, full: true };
  var r = p.presets[preset]; return { pa: P * (1 - r), pb: P * (1 + r), full: false };
}
function formRange(f, p, P) {
  if (f.preset === 'custom') return { pa: parseNum(f.paStr), pb: parseNum(f.pbStr), full: false };
  return presetRange(p, P, f.preset);
}
function presetButtons(p, f, act) {
  var b = p.presets.map(function (r, k) { return '<button class="btn sm ' + (f.preset === k ? 'on' : '') + '" data-act="' + act + '" data-v="' + k + '">' + ['Узкий ', 'Средний ', 'Широкий '][k] + presetF(p, r) + '</button>'; }).join('');
  b += '<button class="btn sm ' + (f.preset === 'full' ? 'on' : '') + '" data-act="' + act + '" data-v="full">Полный</button>';
  b += '<button class="btn sm ' + (f.preset === 'custom' ? 'on' : '') + '" data-act="' + act + '" data-v="custom">Свой</button>';
  return '<div class="row">' + b + '</div>';
}
function rangeInputs(p, P, f, prefix) {
  var r = formRange(f, p, P), full = f.preset === 'full';
  var va = f.preset === 'custom' ? f.paStr : full ? '0' : inputPrice(r.pa, p);
  var vb = f.preset === 'custom' ? f.pbStr : full ? '∞' : inputPrice(r.pb, p);
  return '<div class="inrow">' +
    '<div><label class="f">Мин. цена (' + p.t1 + ' за 1 ' + p.t0 + ')</label><input class="inp" inputmode="decimal" data-f="' + prefix + 'pa" value="' + esc(va) + '"' + (full ? ' disabled' : '') + '></div>' +
    '<div><label class="f">Макс. цена (' + p.t1 + ' за 1 ' + p.t0 + ')</label><input class="inp" inputmode="decimal" data-f="' + prefix + 'pb" value="' + esc(vb) + '"' + (full ? ' disabled' : '') + '></div>' +
    '</div>';
}

function mintChartSpec() {

function rangeWarnings(p, r, P) {
  var w = [];
  if (r.full) w.push('Полный диапазон никогда не выйдет за границы, но комиссий будет в разы меньше, чем у узкого.');
  else {
    var width = r.pb / r.pa - 1;
    var narrow = p.t1 === 'USDT' ? 0.0005 : 0.06;
    if (P <= r.pa) w.push('Весь диапазон выше текущей цены — ты вносишь только ' + p.t0 + '. Комиссии начнутся, когда цена дойдёт до диапазона.');
    else if (P >= r.pb) w.push('Весь диапазон ниже текущей цены — ты вносишь только ' + p.t1 + '. Комиссии начнутся, когда цена опустится в диапазон.');
    if (width < narrow) w.push('Очень узкий диапазон: на бумаге высокий доход, но цена может выйти за границу за считанные часы.');
  }
  return w;
}

function mintPreview() {
  var f = ui.form, p = M.pool(f.pool), P = M.price(st, p), r = formRange(f, p, P), v = parseNum(f.amount), qq;
  try { qq = M.quoteMint(st, p.id, r.pa, r.pb, v); } catch (e) { return '<div class="alert err">' + esc(e.message) + '</div>'; }
  var u0 = M.usd(st, p.t0), u1 = M.usd(st, p.t1), b0 = st.wallet[p.t0], b1 = st.wallet[p.t1];
  var sh0 = Math.max(0, qq.x - b0), sh1 = Math.max(0, qq.y - b1);
  var h = '<p style="margin-top:12px">Ты внесёшь: <b>' + tokF(qq.x, p.t0) + '</b> (' + money(qq.x * u0) + ') и <b>' + tokF(qq.y, p.t1) + '</b> (' + money(qq.y * u1) + ')</p>';
  h += '<p class="sm muted">В кошельке: ' + tokF(b0, p.t0) + ' и ' + tokF(b1, p.t1) + '</p>';
  if (qq.inRange) h += '<div class="alert info">Оценка: ≈ <b>' + pct(qq.feeApr) + ' годовых</b> комиссиями (≈ ' + money(qq.feeApr * v / 365) + ' в день), <b>пока цена в диапазоне</b>. Это не обещание: доход меняется вместе с объёмом торгов, а divergence loss может съесть его.</div>';
  rangeWarnings(p, r, P).forEach(function (t) { h += '<div class="alert safe">' + t + '</div>'; });
  if (!st.connected) return h + '<button class="btn primary block" data-act="connect">Подключить демо-кошелёк</button>';
  if (sh0 > 1e-12 || sh1 > 1e-12) {
    var miss = sh0 > 1e-12 ? tokF(sh0, p.t0) : tokF(sh1, p.t1);
    h += '<div class="alert warn">Не хватает ' + miss + '. В реальном сервисе нужно сначала обменять часть второго токена. Тренажёр может сделать это за тебя одним обменом.</div>';
    h += '<div class="row"><button class="btn" data-act="fixswap">Обменять недостающее</button><button class="btn" data-act="fmax">Внести максимум без обмена</button></div>';
    return h;
  }
  var ethAfter = st.wallet.ETH - (p.t0 === 'ETH' ? qq.x : 0) - (p.t1 === 'ETH' ? qq.y : 0);
  if (ethAfter * M.usd(st, 'ETH') < M.RESERVE_USD) h += '<div class="alert warn">После этой операции почти не останется ETH на газ. Тогда ты не сможешь собрать комиссии или вывести деньги, пока не пополнишь ETH. Оставь запас.</div>';
  h += '<button class="btn primary block" data-act="mint">Создать позицию</button>';
  return h;
}

// ---------- график ----------
function drawCharts() {
  var els = document.querySelectorAll('[data-chart]');
  for (var k = 0; k < els.length; k++) {
    var el = els[k], spec = charts[el.getAttribute('data-chart')];
    if (spec) el.innerHTML = svgChart(spec, Math.max(260, el.clientWidth || 600));
  }
}
function svgChart(spec, W) {
  var p = spec.pool, n = M.nowI(st), from = Math.max(0, n - spec.days * 24);
  var H = Math.round(Math.max(190, Math.min(260, W * 0.42)));
  var stepI = Math.max(1, Math.ceil((n - from) / Math.max(80, Math.floor(W / 2.5))));
  var pts = [];
  for (var i = from; i <= n; i += stepI) pts.push([i, M.price(st, p, i)]);
  if (pts[pts.length - 1][0] !== n) pts.push([n, M.price(st, p, n)]);
  var lo = Infinity, hi = -Infinity;
  pts.forEach(function (q2) { lo = Math.min(lo, q2[1]); hi = Math.max(hi, q2[1]); });
  var span = Math.max(hi - lo, hi * 0.002);
  var band = !spec.full && isFinite(spec.pa) && isFinite(spec.pb) && spec.pa > 0 && spec.pb > spec.pa;
  if (band) {
    if (spec.pa < lo && spec.pa > lo - 3 * span) lo = spec.pa;
    if (spec.pb > hi && spec.pb < hi + 3 * span) hi = spec.pb;
  }
  var pad = (hi - lo || hi * 0.01) * 0.08; lo -= pad; hi += pad;
  var L = 6, R = 66, T = 10, B = 24, w = W - L - R, h = H - T - B;
  var X = function (ii) { return L + (ii - from) / Math.max(1, n - from) * w; };
  var Y = function (v) { return T + (hi - v) / (hi - lo) * h; };
  var ld = p.pdec > 2 ? p.pdec - 1 : (hi < 100 ? 2 : 0);
  var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="График цены ' + pairF(p) + '">';
  for (var g = 0; g <= 3; g++) { var gv = lo + (hi - lo) * g / 3, gy = Y(gv); s += '<line class="grid" x1="' + L + '" x2="' + (L + w) + '" y1="' + gy + '" y2="' + gy + '"/><text class="axis" x="' + (L + w + 6) + '" y="' + (gy + 4) + '">' + num(gv, ld) + '</text>'; }
  if (spec.full) s += '<rect class="band" x="' + L + '" y="' + T + '" width="' + w + '" height="' + h + '"/><text class="bl" x="' + (L + 6) + '" y="' + (T + 14) + '">полный диапазон</text>';
  else if (band) {
    var y1 = Y(Math.min(hi, spec.pb)), y2 = Y(Math.max(lo, spec.pa));
    if (y2 > y1) s += '<rect class="band" x="' + L + '" y="' + y1 + '" width="' + w + '" height="' + (y2 - y1) + '"/>';
    if (spec.pb <= hi && spec.pb >= lo) s += '<line class="bound" x1="' + L + '" x2="' + (L + w) + '" y1="' + Y(spec.pb) + '" y2="' + Y(spec.pb) + '"/><text class="bl" x="' + (L + 6) + '" y="' + (Y(spec.pb) - 4) + '">макс ' + num(spec.pb, ld) + '</text>';
    else s += '<text class="bl" x="' + (L + 6) + '" y="' + (T + 12) + '">макс ' + num(spec.pb, ld) + ' ↑ выше графика</text>';
    if (spec.pa >= lo && spec.pa <= hi) s += '<line class="bound" x1="' + L + '" x2="' + (L + w) + '" y1="' + Y(spec.pa) + '" y2="' + Y(spec.pa) + '"/><text class="bl" x="' + (L + 6) + '" y="' + (Y(spec.pa) + 13) + '">мин ' + num(spec.pa, ld) + '</text>';
    else s += '<text class="bl" x="' + (L + 6) + '" y="' + (T + h - 4) + '">мин ' + num(spec.pa, ld) + ' ↓ ниже графика</text>';
  }
  [[spec.markI, 'старт'], [spec.endI, 'закрыта']].forEach(function (mk) {
    if (mk[0] != null && mk[0] >= from && mk[0] <= n) { var mx = X(mk[0]); s += '<line class="mark" x1="' + mx + '" x2="' + mx + '" y1="' + T + '" y2="' + (T + h) + '"/><text class="axis" x="' + (mx + 3) + '" y="' + (T + h - 4) + '">' + mk[1] + '</text>'; }
  });
  s += '<path class="line" d="M' + pts.map(function (q2) { return X(q2[0]).toFixed(1) + ' ' + Y(q2[1]).toFixed(1); }).join('L') + '"/>';
  var last = pts[pts.length - 1]; s += '<circle cx="' + X(last[0]) + '" cy="' + Y(last[1]) + '" r="4" fill="var(--accent)"/>';
  s += '<text class="axis" x="' + L + '" y="' + (H - 6) + '">' + dateF(from, true) + '</text><text class="axis" x="' + (L + w) + '" y="' + (H - 6) + '" text-anchor="end">' + dateF(n, true) + '</text>';
  return s + '</svg>';
}
